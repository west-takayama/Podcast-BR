name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # id3-check は Python の mutagen で MP3 タグを外から確かめる。
      # 素の pip は環境によって弾かれるので、Python を明示的に用意する
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mutagen
      - run: npm ci
      # 部品の検証。壊れたまま公開しないための関所
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
